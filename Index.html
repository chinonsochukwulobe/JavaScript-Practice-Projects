<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Rating Widget</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="main-container">

        <h1>How did we do?</h1>

        <p>Please rate your experience. Your feedback helps us improve our service.</p>

        <div class="rating-buttons">
            <button class="rating-btn">1</button>
            <button class="rating-btn">2</button>
            <button class="rating-btn">3</button>
            <button class="rating-btn">4</button>
            <button class="rating-btn">5</button>
        </div>

        <button id="submit-btn">Submit</button>

        <p class="error"></p>

    </div>

    <div class="thank-you hidden">

        <h2>Thank You!</h2>

        <p class="selected-rating"></p>

        <p>We appreciate you taking the time to rate us.</p>

    </div>

    <script src="Index.js"></script>

</body>
</html>
