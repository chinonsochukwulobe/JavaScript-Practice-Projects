<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="tip.css">
</head>
<body>

<div class="container">
    <h1>Tip Calculator</h1>

    <label>Bill Amount (₦)</label>
    <input type="number" id="bill" placeholder="Enter bill amount">

    <h3>Select Tip %</h3>

    <div class="tip-buttons">
        <button class="tip-btn" data-tip="5">5%</button>
        <button class="tip-btn" data-tip="10">10%</button>
        <button class="tip-btn" data-tip="15">15%</button>
        <button class="tip-btn" data-tip="25">25%</button>
        <button class="tip-btn" data-tip="50">50%</button>
    </div>

    <label>Custom Tip (%)</label>
    <input type="number" id="custom-tip" placeholder="Enter custom tip">

    <label>Number of People</label>
    <input type="number" id="people" placeholder="Enter number of people">

    <div class="result">
        <p>Tip Amount: ₦<span id="tip-amount">0.00</span></p>
        <p>Tip Per Person: ₦<span id="tip-per-person">0.00</span></p>
        <p>Total Per Person: ₦<span id="total-per-person">0.00</span></p>
    </div>

    <button id="reset-btn">Reset</button>
</div>

<script src="tip.js"></script>

</body>
</html>
